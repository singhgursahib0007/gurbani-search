<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gurbani">
<meta name="description" content="Read and search Gurbani.">
<title>Gurbani</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/search.css">
<link rel="stylesheet" href="css/reader.css">
<script>
  /* Set the theme before first paint, so the app never flashes white. */
  try {
    const p = JSON.parse(localStorage.getItem("gurbani.v1") || "{}");
    const t = p.theme && p.theme !== "auto" ? p.theme
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
    const r = document.documentElement.style;
    if (p.textScale) r.setProperty("--reader-scale", p.textScale);
    if (p.translitScale) r.setProperty("--translit-scale", p.translitScale);
    if (p.translationScale) r.setProperty("--translation-scale", p.translationScale);
    if (p.gurFont) r.setProperty("--gur-font", '"' + p.gurFont + '"');
    if (p.gurWeight) r.setProperty("--gur-weight", p.gurWeight);
  } catch (e) {}
</script>
<script>window.GURBANI_STATIC = {base: "data/"};</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
